name: 🧪 Run tests

on:
  pull_request:
    branches:
      - master
      - release-*
  push:
    branches:
      - master
      - release-*
  workflow_dispatch:
  workflow_call:


jobs:
  tests:
    runs-on: ubuntu-latest
    # Tests with secrets share a Transifex project and a GitHub release, so they run one at a time.
    # A concurrency group holds a single pending run, cancelled by the next one queued:
    # runs without secrets get their own group so they never take that slot.
    # The condition must match HAS_SECRETS below.
    concurrency:
      group: ${{ (github.repository == 'qgis/qgis-plugin-ci' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(github.ref, 'refs/tags/')) && 'testing_environment' || format('tests-{0}', github.run_id) }}
    env:
      # Pull requests from forks and Dependabot get no secrets and a read-only GITHUB_TOKEN.
      # Releases (tags, see release.yml) skip these tests: they ran when the tagged commit landed
      # on its branch, and waiting for the shared environment could get the release cancelled.
      HAS_SECRETS: ${{ github.repository == 'qgis/qgis-plugin-ci' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(github.ref, 'refs/tags/') }}
    steps:
      # Not using strategy.matrix to create multiple jobs
      # as we do NOT want to test with any form of concurrency
      # to avoid 'race conditions' against Transifex

      - name: Check out repository code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project as a package with dev dependencies
        run: python -m pip install -e .[dev]

      - name: Simple cli test
        run: qgis-plugin-ci --help

      - name: Install system requirements
        run: |
          sudo apt-get update
          sudo apt-get install qtbase5-dev qttools5-dev-tools

      - name: Tests
        env:
          tx_api_token: ${{ secrets.TRANSIFEX_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
        run: pytest

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          # tests requiring secrets are skipped otherwise
          fail_below_min: ${{ env.HAS_SECRETS == 'true' }}
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request' && env.HAS_SECRETS == 'true'
        with:
          recreate: true
          path: code-coverage-results.md

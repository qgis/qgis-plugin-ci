name: 🧪 Run tests

concurrency: testing_environment

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version, like 3.15, 3.14'
        type: string
        default: 3.15
  workflow_call:

env:
  # Changing PYTHON minimum version should match the one in pyproject.toml and in pre-commit
  PYTHON_VERSION: "3.11"

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # Pull requests from forks and Dependabot get no secrets and a read-only GITHUB_TOKEN
      HAS_SECRETS: ${{ github.repository == 'qgis/qgis-plugin-ci' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      # Not using strategy.matrix to create multiple jobs
      # as we do NOT want to test with any form of concurrency
      # to avoid 'race conditions' against Transifex

      - name: Check out repository code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version || env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project as a package with dev dependencies
        run: python -m pip install -e .[dev]

      - name: Simple cli test
        run: qgis-plugin-ci --help

      - name: Install system requirements
        run: |
          sudo apt-get update
          sudo apt-get install qt6-base-dev-tools qt6-l10n-tools
          # rcc and lrelease are not in the PATH with Qt6 packages
          echo "/usr/lib/qt6/libexec" >> "$GITHUB_PATH"
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"

      - name: Check Qt tools
        run: |
          rcc --version
          lrelease -version

      - name: Tests
        env:
          tx_api_token: ${{ secrets.TRANSIFEX_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
        run: pytest

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          # tests requiring secrets are skipped otherwise
          fail_below_min: ${{ env.HAS_SECRETS == 'true' }}
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request' && env.HAS_SECRETS == 'true'
        with:
          path: code-coverage-results.md
